services:
  postgres:
    image: postgres:16
    container_name: orm-benchmark-db
    restart: unless-stopped
    cpus: 2
    mem_limit: 2g
    environment:
      TZ: UTC
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U benchmark -d library_benchmark"]
      interval: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orm-benchmark-api
    restart: unless-stopped
    cpus: 2
    mem_limit: 2g
    environment:
      TZ: UTC
      DATABASE_URL: postgresql://benchmark:benchmark123@postgres:5432/library_benchmark
      DB_POOL_MAX: 10
      DATA_ACCESS: ${DATA_ACCESS:-raw}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data: